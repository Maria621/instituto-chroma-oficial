name: Conferir versão publicada

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "SHA completo (40 caracteres) da versão aprovada"
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-verification:
    name: Validar commit e domínio no Vercel
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Obter ferramenta de conferência
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Fixar runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Comparar commit aprovado com produção
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: team_rQpTIXqmRNYzJ3PAbY9tdn5p
          CHROMA_PRODUCTION_HOST: instituto-chroma-oficial.vercel.app
        run: node scripts/verify-production.mjs "$EXPECTED_COMMIT_SHA"
