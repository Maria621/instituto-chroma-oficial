name: Qualidade do site institucional

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-check:
    name: HTML, links, acessibilidade e scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar sintaxe JavaScript
        run: |
          node --check app.js
          node --check contact.js
          node --check v31.js
          node --check fusion.js
          node --check timeline.js
          node --check api/contato.js
          node --check tests/browser-layout.mjs
          node --check tests/visual-review.mjs
          node --check scripts/verify-production.mjs
          node --check tests/contact-api.test.mjs
      - name: Verificar HTML, links, CSS e arquivos
        run: node tests/validate-site.mjs
      - name: Testar a segurança e disponibilidade do contato
        run: node tests/contact-api.test.mjs

  browser-layout:
    name: Texto completo e navegação em telas reais
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Instalar navegador de testes
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          google-chrome --version
      - name: Verificar cortes de texto e interações
        run: node tests/browser-layout.mjs


  visual-review:
    name: Regressão visual comparativa
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Obter código da proposta
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Obter referência da branch base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline

      - name: Fixar ambiente JavaScript
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Preparar análise de imagens
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0 pngjs@7.0.0 pixelmatch@7.1.0
          google-chrome --version

      - name: Capturar telas da versão anterior
        if: github.event_name == 'pull_request'
        run: node tests/visual-review.mjs capture baseline before

      - name: Capturar telas da proposta
        run: node tests/visual-review.mjs capture . after

      - name: Comparar telas e bloquear regressões não aprovadas
        if: github.event_name == 'pull_request'
        env:
          CHROMA_VISUAL_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-approved') }}
        run: node tests/visual-review.mjs compare

      - name: Anexar capturas e diferenças para revisão
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: comparativo-visual-${{ github.run_id }}
          path: artifacts/visual-review/
          retention-days: 14
          if-no-files-found: warn
